<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Vedritam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <div class="header-title">User Management</div>
        </div>
        <div class="header-right">
            <a href="dashboard.html" class="btn btn-secondary" style="background: rgba(255,255,255,0.2); color:white; border:none;">Dashboard</a>
        </div>
    </header>
    <main class="main-content" style="max-width: 1000px; margin: 0 auto;">
        <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
            <h2>System Users</h2>
            <button class="btn btn-primary" onclick="App.ui.showToast('User creation API required.', 'info')">+ New User</button>
        </div>
        <div class="table-wrapper" style="height: auto;">
            <table class="spreadsheet" style="width: 100%;">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Last Login</th>
                        <th>Status</th>
                        <th class="col-action">Edit</th>
                    </tr>
                </thead>
                <tbody id="usersBody">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </main>
    <div id="toast-container"></div>
    <script src="app.js"></script>
</body>
</html>
