<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Search - Vedritam Stock Ledger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <img src="logo.png" alt="Vedritam Logo" onerror="this.style.display='none'">
            <div class="header-title">Vedritam School Stock Ledger</div>
        </div>
        <div class="header-right">
            <a href="dashboard.html" class="btn btn-secondary" style="background: rgba(255,255,255,0.2); color:white; border:none;">Dashboard</a>
            <button class="logout-btn" onclick="App.logout()">Logout</button>
        </div>
    </header>

    <main class="main-content">
        <div class="split-view">
            <!-- Left Pane: School Search -->
            <div class="split-pane pane-left">
                <div class="pane-header" style="display:flex; justify-content:space-between; align-items:center;">
                    <h3>1. Select School</h3>
                    <button class="btn btn-primary admin-only" onclick="App.ui.openModal('modalAddSchool')">+ Add School</button>
                </div>
                <div class="pane-header" style="padding-top: 0; border-bottom: 1px solid var(--border-light);">
                    <input type="text" id="schoolSearch" class="form-control" placeholder="Search by school name, code, or location...">
                </div>
                <div class="pane-body">
                    <ul class="list-group" id="schoolList">
                        <div style="padding: 20px; text-align: center; color: var(--text-muted);">Loading schools...</div>
                    </ul>
                </div>
            </div>

            <!-- Right Pane: Class Selection -->
            <div class="split-pane pane-right">
                <div class="pane-header" style="display:flex; justify-content:space-between; align-items:center;">
                    <h3>2. Select Class</h3>
                    <button class="btn btn-primary admin-only" id="btnAddClass" onclick="App.ui.openModal('modalAddClass')" disabled>+ Add Class</button>
                </div>
                <div class="pane-body" id="classSelectionArea">
                    <div style="text-align: center; color: var(--text-muted); margin-top: 2rem;">
                        Please select a school from the left panel first.
                    </div>
                </div>
                
                <div class="pane-header" style="border-top: 1px solid var(--border-light); background: white; text-align: right; padding: 1.5rem;">
                    <div id="selectionSummary" style="float: left; text-align: left; font-size: 0.9rem; color: var(--text-muted);">
                        No class selected.
                    </div>
                    <button class="btn btn-primary" id="btnOpenLedger" disabled style="padding: 10px 24px; font-size: 1rem;">
                        Open Ledger ➔
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div class="modal-overlay" id="modalAddSchool">
        <div class="modal-content">
            <h3>Add New School</h3>
            <form id="formAddSchool" onsubmit="App.schools.submitAddSchool(event)">
                <div style="margin-top: 1rem;">
                    <label style="display:block; margin-bottom:5px;">School Name <span style="color:red">*</span></label>
                    <input type="text" id="newSchoolName" class="form-control" required>
                </div>
                <div style="margin-top: 1rem;">
                    <label style="display:block; margin-bottom:5px;">School Code</label>
                    <input type="text" id="newSchoolCode" class="form-control">
                </div>
                <div style="margin-top: 1rem;">
                    <label style="display:block; margin-bottom:5px;">Location</label>
                    <input type="text" id="newSchoolLocation" class="form-control">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="App.ui.closeModal('modalAddSchool')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveSchool">Save School</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modalAddClass">
        <div class="modal-content">
            <h3>Add New Class</h3>
            <form id="formAddClass" onsubmit="App.schools.submitAddClass(event)">
                <div style="margin-top: 1rem;">
                    <label style="display:block; margin-bottom:5px;">Class Name <span style="color:red">*</span></label>
                    <input type="text" id="newClassName" class="form-control" placeholder="e.g. Class 5-A" required>
                </div>
                <div style="margin-top: 1rem;">
                    <label style="display:block; margin-bottom:5px;">Class Strength (Students) <span style="color:red">*</span></label>
                    <input type="number" id="newClassStrength" class="form-control" min="0" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="App.ui.closeModal('modalAddClass')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveClass">Save Class</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>
<!-- schools.html (Append this to the bottom before scripts) -->
    <div class="modal-overlay" id="modalDeleteStruct">
        <div class="modal-content">
            <h3 style="color: var(--danger);">Confirm Deletion</h3>
            <p>Are you sure you want to delete this <span id="lblDeleteType"></span>? Linked data safety rules apply.</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="App.ui.closeModal('modalDeleteStruct')">Cancel</button>
                <button type="button" class="btn btn-danger" onclick="App.schools.executeDeleteStruct()">Delete Permanently</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
