<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Vedritam School Stock Ledger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <img src="logo.png" alt="Vedritam Logo" onerror="this.style.display='none'">
            <div class="header-title">Vedritam School Stock Ledger</div>
        </div>
        <div class="header-right">
            <div class="user-info">Logged in as: <strong id="navUsername">Admin</strong></div>
            <button class="logout-btn" onclick="App.logout()">Logout</button>
        </div>
    </header>

    <main class="main-content">
        <h2 style="text-align: center; margin-bottom: 2rem; color: var(--text-muted); font-weight: 400;">Main Menu</h2>
        <div class="dash-grid">
            <a href="schools.html" class="dash-card">
                <div style="font-size: 2.5rem;">🏫</div>
                <h3>School Search & Ledger</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Select a school and class to manage inventory records.</p>
            </a>
            <a href="#" class="dash-card" onclick="App.ui.showToast('Reports module coming soon.', 'info'); return false;">
                <div style="font-size: 2.5rem;">📊</div>
                <h3>Reports & Exports</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Generate consolidated statements and stock alerts.</p>
            </a>
            <a href="users.html" class="dash-card admin-only" style="display: none;">
                <div style="font-size: 2.5rem;">👥</div>
                <h3>User Management</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Manage administrator and staff access levels.</p>
            </a>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="app.js"></script>
</body>
</html>
