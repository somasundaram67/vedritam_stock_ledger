<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger - Vedritam Stock Ledger</title>
    <script>(function(){try{var t=localStorage.getItem('v_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<link rel="stylesheet" href="style.css?v=4.13">
    <link rel="stylesheet" href="theme.css?v=4.13">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body data-page="ledger">
    <header class="app-header">
        <div class="header-left">
            <img src="logo.png" alt="Vedritam Logo" onerror="this.style.display='none'">
            <div class="header-title">Vedritam School Stock Ledger</div>
        </div>
        <div class="header-right">
            <button class="logout-btn" onclick="vSignOut()">Logout</button>
        </div>
    </header>

    <main class="ledger-container">
        <div class="ledger-header">
            <div>
                <div class="breadcrumbs" style="display:flex; align-items:center;">
                    <a href="dashboard.html">Dashboard</a> <span style="margin: 0 0.5rem;">/</span> 
                    <a href="schools.html">Schools</a> <span style="margin: 0 0.5rem;">/</span> 
                    <strong id="lblSchoolName">Loading...</strong> <span style="margin: 0 0.5rem;">/</span> 
                    <strong id="lblClassName">...</strong>

                    <span id="lblClassStrength" style="margin-left: 15px; padding: 3px 8px; background: rgba(15, 58, 97, 0.1); color: var(--primary-color); border-radius: 4px; font-weight: 500;">
                        Strength: ...
                    </span>
                </div>
                <h2 style="margin: 0;">Stock Ledger</h2>
            </div>
            
            <div class="toolbar">
                <input type="text" id="ledgerSearch" class="form-control" placeholder="Fast search..." style="width: 250px;">
                <button class="btn btn-secondary" onclick="App.ledger.addRecord()">+ Add Row</button>
                <button class="btn btn-secondary" onclick="App.ledger.fetchData()">↻ Refresh</button>
		<button class="btn btn-secondary" onclick="App.ledger.downloadCSV()">↓ Download</button>
                <button class="btn btn-primary" id="btnSaveLedger" onclick="App.ledger.saveChanges()">Save Changes (0)</button>
                <button class="btn btn-danger" id="btnDeleteRow" onclick="App.ledger.deleteSelected()">Delete</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table class="spreadsheet" id="ledgerTable">
                <thead>
                    <tr>
                        <th style="width:40px">#</th>
                        <th>Book Name</th>
                        <th>Subject</th>
                        <th>Publication</th>
                        <th>Vendor</th>
                        <th>Category</th>
                        <th>Invoice Ref</th>
                        <th class="col-num" style="background-color: rgba(0,0,0,0.1)">Strength</th>
                        <th class="col-num">Purchased</th>
                        <th class="col-num" style="background-color: rgba(0,0,0,0.1)">Req. Books</th>
                        <th class="col-num">Distributed</th>
                        <th class="col-num">Returned</th>
                        <th class="col-num" style="background-color: rgba(0,0,0,0.1)">Balance</th>
                        <th>Remarks</th>
                    </tr>
                </thead>
                <tbody id="ledgerBody">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="app.js?v=4.13"></script>
<script src="shell.js?v=4.13"></script>
</body>
</html>
