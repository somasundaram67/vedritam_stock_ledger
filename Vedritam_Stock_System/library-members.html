<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Members - Vedritam</title>
<script>(function(){try{var t=localStorage.getItem('v_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}try{if(localStorage.getItem('v_mode')!=='library')localStorage.setItem('v_mode','library');}catch(e){}})();</script>
<link rel="stylesheet" href="style.css?v=4.13">
<link rel="stylesheet" href="theme.css?v=4.13">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  .mb-grid{display:grid;grid-template-columns:1fr 2fr;gap:18px}
  @media(max-width:900px){.mb-grid{grid-template-columns:1fr}}
  .mb-card{background:var(--v-surface,#fff);border:1px solid var(--v-border,#e2e8f0);border-radius:14px;padding:18px}
  .mb-card h3{margin:0 0 12px;font-size:16px;font-weight:650}
  .mb-form label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted,#64748B);margin:8px 0 4px}
  .mb-form input,.mb-form select{width:100%;padding:9px 11px;border:1px solid var(--v-border,#e2e8f0);border-radius:8px;background:transparent;color:inherit;font:inherit}
  .mb-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .mb-tbl th,.mb-tbl td{padding:9px 8px;border-bottom:1px solid var(--v-border,#e2e8f0);text-align:left}
  .mb-tbl th{font-size:12px;color:var(--text-muted,#64748B);text-transform:uppercase;letter-spacing:.03em}
</style>
</head>
<body data-page="library-members">
<main class="main-content">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px">
    <div>
      <h1 class="v-page-title">Library — Members</h1>
      <p class="v-page-sub">Register students with their Name, Class, Section and UID. The UID must be unique inside each school.</p>
    </div>
  </div>

  <div class="mb-grid">
    <div class="mb-card">
      <h3>Register member</h3>
      <form id="mForm" class="mb-form">
        <label>School</label><select id="mSchool" required></select>
        <label>Name *</label><input id="mName" required>
        <label>Class *</label><input id="mClass" placeholder="e.g. 8" required>
        <label>Section *</label><input id="mSection" placeholder="e.g. B" required>
        <label>UID *</label><input id="mUid" placeholder="unique per school" required>
        <button class="v-btn" type="submit" style="margin-top:14px">Register</button>
      </form>
    </div>

    <div class="mb-card">
      <h3>All members</h3>
      <input id="mSearch" placeholder="Search name / UID / class" style="width:100%;padding:9px 11px;border:1px solid var(--v-border,#e2e8f0);border-radius:8px;background:transparent;color:inherit;margin-bottom:10px">
      <div style="max-height:560px;overflow:auto">
        <table class="mb-tbl">
          <thead><tr><th>UID</th><th>Name</th><th>Class</th><th>Section</th><th class="admin-only"></th></tr></thead>
          <tbody id="mBody"><tr><td colspan="5" style="text-align:center;color:var(--text-muted)">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div id="toast-container"></div>
<script src="app.js?v=4.13"></script>
<script src="shell.js?v=4.13"></script>
<script src="chatbot.js?v=4.13"></script>
<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function toast(m,t){ if(window.App&&App.ui) App.ui.showToast(m,t||'success'); }
  var isAdmin = localStorage.getItem('v_role')==='admin';
  var all = [];

  async function loadSchools(){
    var schools = await App.apiCall('/library/schools');
    var sel = document.getElementById('mSchool');
    if (!schools.length) {
      sel.innerHTML = '<option value="">No library schools yet — add one on the Books page</option>';
      return;
    }
    sel.innerHTML = schools.map(function(s){
      return '<option value="'+s.id+'">'+esc(s.name)+'</option>';
    }).join('');
  }
  function render(list){
    var body = document.getElementById('mBody');
    if(!list.length){ body.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">No members yet.</td></tr>'; return; }
    body.innerHTML = list.map(function(m){
      return '<tr><td><b>'+esc(m.uid)+'</b></td><td>'+esc(m.name)+'</td><td>'+esc(m.class_name)+'</td><td>'+esc(m.section)+'</td>'+
        '<td class="admin-only">'+(isAdmin?'<button class="v-btn ghost" data-del="'+m.id+'" style="padding:4px 10px">Delete</button>':'')+'</td></tr>';
    }).join('');
    if(!isAdmin) document.querySelectorAll('.admin-only').forEach(function(el){ el.style.display='none'; });
  }
  async function loadMembers(){
    all = await App.apiCall('/library/members');
    render(all);
  }
  document.getElementById('mForm').addEventListener('submit', async function(e){
    e.preventDefault();
    try{
      await App.apiCall('/library/members','POST',{
        schoolId: parseInt(document.getElementById('mSchool').value,10),
        name: document.getElementById('mName').value,
        className: document.getElementById('mClass').value,
        section: document.getElementById('mSection').value,
        uid: document.getElementById('mUid').value,
      });
      toast('Member registered.');
      this.reset(); loadMembers();
    }catch(err){ toast(err.message,'error'); }
  });
  document.getElementById('mBody').addEventListener('click', async function(e){
    var b = e.target.closest('button[data-del]'); if(!b) return;
    if(!confirm('Delete this member?')) return;
    try{ await App.apiCall('/library/members/'+b.dataset.del,'DELETE'); toast('Deleted.'); loadMembers(); }
    catch(err){ toast(err.message,'error'); }
  });
  document.getElementById('mSearch').addEventListener('input', function(){
    var q = this.value.trim().toLowerCase();
    if(!q){ render(all); return; }
    render(all.filter(function(m){
      return (m.name||'').toLowerCase().indexOf(q)>=0
          || (m.uid||'').toLowerCase().indexOf(q)>=0
          || (m.class_name||'').toLowerCase().indexOf(q)>=0
          || (m.section||'').toLowerCase().indexOf(q)>=0;
    }));
  });
  document.addEventListener('DOMContentLoaded', function(){
    if(!localStorage.getItem('v_token')){ window.location.href='index.html'; return; }
    loadSchools(); loadMembers();
  });
})();
</script>
</body>
</html>
