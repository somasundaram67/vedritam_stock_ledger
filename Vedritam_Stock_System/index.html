<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vedritam School Stock Ledger</title>
    <link rel="stylesheet" href="style.css?v=10.0">
    <script>
	// ==========================================================
// CYBER CURSOR MOUSE TRACKER & AUTOMATIC STATE SWITCHER
// ==========================================================
document.addEventListener('DOMContentLoaded', () => {
  const cursor = document.getElementById('cyber-cursor');
  if (!cursor) return;

  // Track Mouse Position
  window.addEventListener('mousemove', (e) => {
    cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
  });

  // Switch Cursor States Based on Hovered Target
  document.addEventListener('mouseover', (e) => {
    const target = e.target;
    
    // 1. Hovering Clickable Elements -> Pointer Lock State
    if (target.closest('a, button, input[type="submit"], input[type="button"], select, [role="button"], .clickable')) {
      cursor.className = 'cyber-cursor state-pointer';
    } 
    // 2. Hovering Text Elements -> Text Reticle State
    else if (target.closest('p, h1, h2, h3, h4, h5, h6, span, label, input[type="text"], textarea')) {
      cursor.className = 'cyber-cursor state-text';
    } 
    // 3. General Background -> Default Cyber Arrow State
    else {
      cursor.className = 'cyber-cursor state-default';
    }
  });

  // Smoothly hide cursor if mouse leaves window
  document.addEventListener('mouseleave', () => cursor.style.opacity = '0');
  document.addEventListener('mouseenter', () => cursor.style.opacity = '1');
});
    </script>
</head>
<body>
    <div class="login-bg">
        <div class="login-card">
            <img src="logo.png" alt="Vedritam Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'150\' height=\'40\'><text x=\'0\' y=\'30\' font-family=\'Arial\' font-size=\'30\' fill=\'%230f3a61\' font-weight=\'bold\'>VEDRITAM</text></svg>'">

            <div class="auth-tabs" id="authTabs">
                <button type="button" class="auth-tab active" data-tab="signin">Sign In</button>
                <button type="button" class="auth-tab" data-tab="signup">Sign Up</button>
            </div>

            <!-- Sign in -->
            <div id="paneSignin">
                <h2>System Login</h2>
                <form class="login-form" id="loginForm">
                    <div>
                        <label style="display:block; margin-bottom:5px; font-size:0.85rem;">Username</label>
                        <input type="text" id="username" class="form-control" required autocomplete="username">
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:5px; font-size:0.85rem;">Password</label>
                        <input type="password" id="password" class="form-control" required autocomplete="current-password">
                    </div>
                    <div class="form-group" id="twofaField" style="display:none">
                        <label for="twofaCode">Verification code</label>
                        <input type="text" id="twofaCode" class="form-control" inputmode="numeric" autocomplete="one-time-code"
                               maxlength="9" placeholder="6-digit code or backup code">
                    </div>
                    <button type="submit" class="btn btn-primary" id="loginBtn">Authenticate</button>
                </form>
                <p class="auth-note">
                    No account yet? <a href="#" data-goto="signup">Request access</a> — an administrator approves every new account.
                </p>
            </div>

            <!-- Sign up -->
            <div id="paneSignup" style="display:none;">
                <h2>Request an Account</h2>
                <form class="login-form" id="signupForm">
                    <div>
                        <label style="display:block; margin-bottom:5px; font-size:0.85rem;">School / Organisation</label>
                        <input type="text" id="suSchool" class="form-control" placeholder="e.g. DAV BGPM" required>
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:5px; font-size:0.85rem;">Contact Person</label>
                        <input type="text" id="suFullName" class="form-control" placeholder="Full name" required>
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:5px; font-size:0.85rem;">Email</label>
                        <input type="email" id="suEmail" class="form-control" placeholder="name@school.edu">
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:5px; font-size:0.85rem;">Username</label>
                        <input type="text" id="suUsername" class="form-control" required autocomplete="username">
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:5px; font-size:0.85rem;">Password</label>
                        <input type="password" id="suPassword" class="form-control" required minlength="6" autocomplete="new-password">
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:5px; font-size:0.85rem;">Confirm Password</label>
                        <input type="password" id="suPassword2" class="form-control" required minlength="6" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary" id="signupBtn">Submit Request</button>
                </form>
                <p class="auth-note">
                    Requests are created as <strong>Pending</strong>. You can sign in once an administrator approves the account.
                    <br>Already approved? <a href="#" data-goto="signin">Back to sign in</a>
                </p>
            </div>
        </div>
    </div>
    <div id="toast-container"></div>
<!-- CYBER-ASTRONOMICAL OVERLAY CURSOR -->
<div id="cyber-cursor" class="cyber-cursor state-default">
  
  <!-- 1. DEFAULT CURSOR: Cyber Ship + Astrolabe Galaxy Ring + Thruster -->
  <svg class="cursor-svg state-default-svg" viewBox="0 0 100 100" width="70" height="70">
    <defs>
      <filter id="cyan-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="30%" stop-color="#00ffff" />
        <stop offset="100%" stop-color="#003b5c" />
      </linearGradient>
      <linearGradient id="flame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="40%" stop-color="#00ffff" />
        <stop offset="100%" stop-color="rgba(0,255,255,0)" />
      </linearGradient>
    </defs>
    
    <g filter="url(#cyan-glow)">
      <!-- Thruster Plume Flame -->
      <polygon points="26,60 8,92 38,68" fill="url(#flame-grad)" class="cyber-thruster"/>
      
      <!-- Main Cybernetic Arrow Body -->
      <path d="M 10,10 L 10,72 L 28,54 L 46,82 L 56,76 L 38,48 L 70,48 Z" 
            fill="url(#cyber-grad)" stroke="#00ffff" stroke-width="2" stroke-linejoin="round"/>
      
      <!-- Internal Circuit Traces -->
      <path d="M 18,22 L 28,22 L 34,32 M 18,36 L 24,36" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
      <circle cx="34" cy="32" r="1.5" fill="#ffffff" />
      
      <!-- Astronomical Galaxy Ring HUD Overlay -->
      <g transform="translate(56, 32)">
        <circle cx="0" cy="0" r="22" fill="none" stroke="#00ffff" stroke-width="1.8"/>
        <circle cx="0" cy="0" r="17" fill="none" stroke="#80ffff" stroke-width="1" stroke-dasharray="4,2"/>
        <!-- Spiral Galaxy Center -->
        <path d="M -8,0 C -8,-8 0,-10 4,-4 C 8,2 0,8 -6,4 C -10,0 -4,-6 0,-6" fill="none" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="2" fill="#ffffff"/>
        <!-- Reticle Crosshairs & Cardinal Ticks -->
        <line x1="-25" y1="0" x2="25" y2="0" stroke="#00ffff" stroke-width="1" opacity="0.7"/>
        <line x1="0" y1="-25" x2="0" y2="25" stroke="#00ffff" stroke-width="1" opacity="0.7"/>
        <polygon points="0,-22 -3,-17 3,-17" fill="#00ffff"/>
        <polygon points="22,0 17,-3 17,3" fill="#00ffff"/>
      </g>
    </g>
  </svg>

  <!-- 2. POINTER / CLICK CURSOR: Cybernetic Locking Target (Links/Buttons) -->
  <svg class="cursor-svg state-pointer-svg" viewBox="0 0 100 100" width="70" height="70">
    <g filter="url(#cyan-glow)">
      <!-- Outer Rotating Astrolabe Ring -->
      <circle cx="50" cy="50" r="36" fill="none" stroke="#00ffff" stroke-width="2" stroke-dasharray="12,6" class="cyber-rotate"/>
      <circle cx="50" cy="50" r="26" fill="rgba(0, 255, 255, 0.12)" stroke="#80ffff" stroke-width="1.5"/>
      <!-- Core Reticle & Lock Point -->
      <circle cx="50" cy="50" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="50" cy="50" r="4" fill="#ffffff"/>
      <path d="M 50,6 L 50,20 M 50,80 L 50,94 M 6,50 L 20,50 M 80,50 L 94,50" stroke="#00ffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 24,30 L 20,30 L 20,34 M 76,30 L 80,30 L 80,34 M 20,66 L 20,70 L 24,70 M 80,66 L 80,70 L 76,70" fill="none" stroke="#00ffff" stroke-width="2"/>
    </g>
  </svg>

  <!-- 3. TEXT / TYPE CURSOR: Astronomical Laser Beam HUD (Text Selection) -->
  <svg class="cursor-svg state-text-svg" viewBox="0 0 100 100" width="70" height="70">
    <g filter="url(#cyan-glow)">
      <!-- Central Beam -->
      <line x1="50" y1="12" x2="50" y2="88" stroke="#00ffff" stroke-width="3"/>
      <line x1="50" y1="18" x2="50" y2="82" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="30" y1="12" x2="70" y2="12" stroke="#00ffff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="30" y1="88" x2="70" y2="88" stroke="#00ffff" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Optical Lens & Coordinate Brackets -->
      <circle cx="50" cy="50" r="18" fill="none" stroke="#00ffff" stroke-width="1.5" stroke-dasharray="6,3"/>
      <circle cx="50" cy="50" r="6" fill="rgba(0, 255, 255, 0.25)" stroke="#ffffff" stroke-width="1"/>
      <path d="M 24,34 L 16,34 L 16,66 L 24,66 M 76,34 L 84,34 L 84,66 L 76,66" fill="none" stroke="#80ffff" stroke-width="1.5"/>
    </g>
  </svg>

</div>
    <script src="app.js?v=10.0"></script>
</body>
</html>
