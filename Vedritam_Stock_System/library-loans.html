<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Loans - Vedritam</title>
<script>(function(){try{var t=localStorage.getItem('v_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}try{if(localStorage.getItem('v_mode')!=='library')localStorage.setItem('v_mode','library');}catch(e){}})();</script>
<link rel="stylesheet" href="style.css?v=4.13">
<link rel="stylesheet" href="theme.css?v=4.13">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  .ln-grid{display:grid;grid-template-columns:1fr 2fr;gap:18px}
  @media(max-width:900px){.ln-grid{grid-template-columns:1fr}}
  .ln-card{background:var(--v-surface,#fff);border:1px solid var(--v-border,#e2e8f0);border-radius:14px;padding:18px}
  .ln-card h3{margin:0 0 12px;font-size:16px;font-weight:650}
  .ln-form label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted,#64748B);margin:8px 0 4px}
  .ln-form input,.ln-form select,.ln-form textarea{width:100%;padding:9px 11px;border:1px solid var(--v-border,#e2e8f0);border-radius:8px;background:transparent;color:inherit;font:inherit}
  .ln-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .ln-tbl th,.ln-tbl td{padding:9px 8px;border-bottom:1px solid var(--v-border,#e2e8f0);text-align:left}
  .ln-tbl th{font-size:12px;color:var(--text-muted,#64748B);text-transform:uppercase;letter-spacing:.03em}
  tr.overdue{background:rgba(220,38,38,.08)}
  .st{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
  .st.Issued{background:rgba(37,99,235,.15);color:#1D4ED8}
  .st.Returned{background:rgba(22,163,74,.15);color:#15803D}
  .st.Overdue{background:rgba(220,38,38,.15);color:#B91C1C}
  .ln-banner{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.35);color:#B91C1C;padding:12px 14px;border-radius:10px;margin-bottom:14px;display:none}
</style>
</head>
<body data-page="library-loans">
<main class="main-content">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px">
    <div>
      <h1 class="v-page-title">Library — Loans</h1>
      <p class="v-page-sub">Issue books to members with a due date. Overdue loans are highlighted and drive the reminder bell.</p>
    </div>
  </div>

  <div id="lnBanner" class="ln-banner"></div>

  <div class="ln-grid">
    <div class="ln-card">
      <h3>Issue a book</h3>
      <form id="lnForm" class="ln-form">
        <label>School</label><select id="lnSchool" required></select>
        <label>Book</label><select id="lnBook" required></select>
        <label>Member (UID · Name)</label><select id="lnMember" required></select>
        <label>Due date *</label><input id="lnDue" type="date" required>
        <label>Remarks</label><textarea id="lnRemarks" rows="2"></textarea>
        <button class="v-btn" type="submit" style="margin-top:14px">Issue book</button>
      </form>
    </div>

    <div class="ln-card">
      <h3>Loans</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
        <input id="lnSearch" placeholder="Search book / member / UID" style="flex:1;min-width:220px;padding:9px 11px;border:1px solid var(--v-border,#e2e8f0);border-radius:8px;background:transparent;color:inherit">
        <select id="lnFilter" style="padding:9px 11px;border:1px solid var(--v-border,#e2e8f0);border-radius:8px;background:transparent;color:inherit">
          <option value="all">All</option>
          <option value="Issued">Issued</option>
          <option value="Overdue">Overdue</option>
          <option value="Returned">Returned</option>
        </select>
      </div>
      <div style="max-height:560px;overflow:auto">
        <table class="ln-tbl">
          <thead><tr><th>Book</th><th>Member</th><th>Class</th><th>Issued</th><th>Due</th><th>Status</th><th></th></tr></thead>
          <tbody id="lnBody"><tr><td colspan="7" style="text-align:center;color:var(--text-muted)">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div id="toast-container"></div>
<script src="app.js?v=4.13"></script>
<script src="shell.js?v=4.13"></script>
<script src="chatbot.js?v=4.13"></script>
<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function toast(m,t){ if(window.App&&App.ui) App.ui.showToast(m,t||'success'); }
  var allLoans = [], allBooks = [], allMembers = [];

  async function loadSchools(){
    var schools = await App.apiCall('/library/schools');
    var sel = document.getElementById('lnSchool');
    if (!schools.length) {
      sel.innerHTML = '<option value="">No library schools yet — add one on the Books page</option>';
      return;
    }
    sel.innerHTML = schools.map(function(s){
      return '<option value="'+s.id+'">'+esc(s.name)+'</option>';
    }).join('');
  }
  async function refreshDropdowns(){
    var sid = document.getElementById('lnSchool').value;
    var books = allBooks.filter(function(b){ return String(b.school_id)===String(sid) && Number(b.available)>0; });
    var members = allMembers.filter(function(m){ return String(m.school_id)===String(sid); });
    document.getElementById('lnBook').innerHTML = books.length
      ? books.map(function(b){ return '<option value="'+b.id+'">'+esc(b.title)+(b.accession?' [#'+esc(b.accession)+']':'')+' — '+b.available+' avail.</option>'; }).join('')
      : '<option value="">No available copies in this school</option>';
    document.getElementById('lnMember').innerHTML = members.length
      ? members.map(function(m){ return '<option value="'+m.id+'">'+esc(m.uid)+' · '+esc(m.name)+' ('+esc(m.class_name)+'-'+esc(m.section)+')</option>'; }).join('')
      : '<option value="">No members yet — register one first</option>';
  }
  function render(list){
    var body = document.getElementById('lnBody');
    if(!list.length){ body.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--text-muted)">No loans.</td></tr>'; return; }
    body.innerHTML = list.map(function(l){
      var cls = l.status==='Overdue' ? 'overdue' : '';
      var action = l.returned_at
        ? '<span style="color:var(--text-muted)">Returned '+esc((l.returned_at||'').slice(0,10))+'</span>'
        : '<button class="v-btn ghost" data-ret="'+l.id+'" style="padding:4px 10px">Return</button>';
      return '<tr class="'+cls+'"><td><b>'+esc(l.book_title)+'</b>'+(l.book_accession?' <small style="color:var(--text-muted)">#'+esc(l.book_accession)+'</small>':'')+'</td>'+
        '<td>'+esc(l.member_name)+' <small style="color:var(--text-muted)">('+esc(l.member_uid)+')</small></td>'+
        '<td>'+esc(l.member_class)+'</td>'+
        '<td>'+esc((l.issued_at||'').slice(0,10))+'</td>'+
        '<td>'+esc(l.due_at)+'</td>'+
        '<td><span class="st '+esc(l.status)+'">'+esc(l.status)+'</span></td>'+
        '<td>'+action+'</td></tr>';
    }).join('');
  }
  function applyFilter(){
    var q = document.getElementById('lnSearch').value.trim().toLowerCase();
    var f = document.getElementById('lnFilter').value;
    var list = allLoans.filter(function(l){
      if (f!=='all' && l.status!==f) return false;
      if (!q) return true;
      return (l.book_title||'').toLowerCase().indexOf(q)>=0
          || (l.member_name||'').toLowerCase().indexOf(q)>=0
          || (l.member_uid||'').toLowerCase().indexOf(q)>=0
          || (l.member_class||'').toLowerCase().indexOf(q)>=0;
    });
    render(list);
  }
  async function loadAll(){
    var results = await Promise.all([
      App.apiCall('/library/loans'),
      App.apiCall('/library/catalog'),
      App.apiCall('/library/members'),
      App.apiCall('/library/reminders').catch(function(){ return {counts:{overdue:0,due_soon:0}}; })
    ]);
    allLoans = results[0]; allBooks = results[1]; allMembers = results[2];
    var rem = results[3];
    var over=(rem.counts&&rem.counts.overdue)||0, soon=(rem.counts&&rem.counts.due_soon)||0;
    var banner = document.getElementById('lnBanner');
    if(over||soon){ banner.style.display=''; banner.innerHTML='<b>'+over+'</b> overdue and <b>'+soon+'</b> due within 3 days.'; }
    else banner.style.display='none';
    refreshDropdowns();
    applyFilter();
  }

  document.getElementById('lnSchool').addEventListener('change', refreshDropdowns);
  document.getElementById('lnSearch').addEventListener('input', applyFilter);
  document.getElementById('lnFilter').addEventListener('change', applyFilter);

  document.getElementById('lnForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var due = document.getElementById('lnDue').value;
    if(!due){ toast('Please set a due date.','error'); return; }
    try{
      await App.apiCall('/library/loans','POST',{
        schoolId: parseInt(document.getElementById('lnSchool').value,10),
        catalogId: document.getElementById('lnBook').value,
        memberId:  document.getElementById('lnMember').value,
        dueAt: due,
        remarks: document.getElementById('lnRemarks').value,
      });
      toast('Book issued.'); this.reset(); await loadAll();
    }catch(err){ toast(err.message,'error'); }
  });
  document.getElementById('lnBody').addEventListener('click', async function(e){
    var b = e.target.closest('button[data-ret]'); if(!b) return;
    try{ await App.apiCall('/library/loans/'+b.dataset.ret+'/return','POST'); toast('Book returned.'); loadAll(); }
    catch(err){ toast(err.message,'error'); }
  });

  document.addEventListener('DOMContentLoaded', function(){
    if(!localStorage.getItem('v_token')){ window.location.href='index.html'; return; }
    // Default the due date to 14 days from today.
    var d = new Date(); d.setDate(d.getDate()+14);
    document.getElementById('lnDue').value = d.toISOString().slice(0,10);
    loadSchools().then(loadAll);
  });
})();
</script>
</body>
</html>
